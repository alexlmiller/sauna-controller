###############################################################################
# Wall Panel - M5Stack Dial Hardware
###############################################################################

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  on_boot:
    priority: 800
    then:
      # Required when powered from the rear terminal or battery.
      - output.turn_on: dial_hold
      - light.turn_on:
          id: display_backlight
          brightness: 90%

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 8MB
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: "y"

logger:
  level: INFO
  baud_rate: 0

wifi:
  ssid: ${wifi_ssid}
  password: ${wifi_password}

ota:
  platform: esphome
  password: ${ota_password}

############### M5DIAL HARDWARE ###############

i2c:
  sda: GPIO11
  scl: GPIO12
  id: bus_a

spi:
  clk_pin: GPIO6
  mosi_pin: GPIO5

output:
  - platform: gpio
    id: dial_hold
    pin:
      number: GPIO46
      mode: { output: true }
      ignore_strapping_warning: true

  - platform: ledc
    pin: GPIO9
    id: bl_pwm
    frequency: 19531Hz

light:
  - platform: monochromatic
    name: "LCD Backlight"
    output: bl_pwm
    id: display_backlight
    default_transition_length: 0s
    restore_mode: ALWAYS_ON

touchscreen:
  - platform: ft63x6
    id: panel_touch
    i2c_id: bus_a
    interrupt_pin: GPIO14

display:
  - platform: ili9xxx
    model: GC9A01A
    id: panel_display
    update_interval: never
    cs_pin: GPIO7
    dc_pin: GPIO4
    reset_pin: GPIO8
    invert_colors: true
    color_order: BGR
    dimensions:
      width: 240
      height: 240
    transform:
      mirror_x: true
      mirror_y: false
      swap_xy: false
