###############################################################################
# Wall Panel - M5Stack Dial LVGL UI
###############################################################################

############### FONTS ###############

font:
  - file: "gfonts://Montserrat@300"
    id: font_hero
    size: 52
    bpp: 4
    glyphs: " -0123456789°"
  - file: "gfonts://Montserrat@400"
    id: font_body
    size: 16
    bpp: 4
    glyphs: " !%()-./0123456789:ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz°"
  - file: "gfonts://Montserrat@500"
    id: font_body_lg
    size: 22
    bpp: 4
    glyphs: " !%()-./0123456789:ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz°"

############### LVGL UI ###############

lvgl:
  displays:
    - panel_display
  touchscreens:
    - panel_touch
  color_depth: 16
  buffer_size: 25%
  page_wrap: true

  pages:
    ###########################################################
    # TEMPERATURE
    ###########################################################
    - id: main_page
      bg_color: 0x101116
      bg_opa: COVER
      clickable: true
      on_single_click:
        then:
          - script.execute: dial_next_page
      widgets:
        - arc:
            id: arc_status_ring
            width: 232
            height: 232
            align: CENTER
            adjustable: false
            start_angle: 135
            end_angle: 45
            value: 100
            min_value: 0
            max_value: 100
            arc_width: 16
            arc_color: 0x252833
            indicator:
              arc_width: 16
              arc_color: 0x555555

        - label:
            align: CENTER
            y: -60
            text: "HEATER"
            text_font: font_body
            text_color: 0x666A78

        - label:
            id: lbl_current_temp
            align: CENTER
            y: -14
            text: "--°"
            text_font: font_hero
            text_color: 0xFFFFFF

        - label:
            id: lbl_target_temp
            align: CENTER
            y: 34
            text: "--°F"
            text_font: font_body_lg
            text_color: 0x777B86

        - label:
            id: lbl_status
            align: CENTER
            y: 66
            text: "OFF"
            text_font: font_body
            text_color: 0x555555

        - obj:
            id: fault_banner
            align: CENTER
            y: -88
            width: 142
            height: 30
            bg_color: 0xCC2222
            bg_opa: COVER
            radius: 15
            border_width: 0
            hidden: true
            widgets:
              - label:
                  id: lbl_fault_text
                  align: CENTER
                  text: "FAULT"
                  text_font: font_body
                  text_color: 0xFFFFFF

        - label:
            id: no_link_warning
            align: CENTER
            y: -86
            text: "NO LINK"
            text_font: font_body
            text_color: 0xFF5555
            hidden: true

    ###########################################################
    # LIGHTING
    ###########################################################
    - id: light_page
      bg_color: 0x101116
      bg_opa: COVER
      clickable: true
      on_single_click:
        then:
          - script.execute: dial_next_page
      widgets:
        - arc:
            id: arc_brightness
            width: 232
            height: 232
            align: CENTER
            adjustable: false
            start_angle: 135
            end_angle: 45
            min_value: 0
            max_value: 100
            value: 0
            arc_width: 16
            arc_color: 0x252833
            indicator:
              arc_width: 16
              arc_color: 0xFF6B00

        - label:
            align: CENTER
            y: -70
            text: "LIGHTS"
            text_font: font_body
            text_color: 0x666A78

        - label:
            id: lbl_brightness_pct
            align: CENTER
            y: -38
            text: "--%"
            text_font: font_body_lg
            text_color: 0xFFFFFF

        - button:
            id: btn_preset_warm
            align: CENTER
            x: -42
            y: -2
            width: 48
            height: 48
            radius: 24
            bg_color: 0xFFFFFF
            border_width: 0
            outline_width: 0
            on_click:
              then:
                - lambda: 'id(active_preset) = 0; id(preset_pending) = 0; id(preset_set_ms) = millis();'
                - script.execute: update_light_ring
                - script.execute: update_light_selection

        - button:
            id: btn_preset_sunset
            align: CENTER
            x: 42
            y: -2
            width: 48
            height: 48
            radius: 24
            bg_color: 0xFFB366
            border_width: 0
            outline_width: 0
            on_click:
              then:
                - lambda: 'id(active_preset) = 1; id(preset_pending) = 1; id(preset_set_ms) = millis();'
                - script.execute: update_light_ring
                - script.execute: update_light_selection

        - button:
            id: btn_preset_red
            align: CENTER
            x: -42
            y: 56
            width: 48
            height: 48
            radius: 24
            bg_color: 0x8B0000
            border_width: 0
            outline_width: 0
            on_click:
              then:
                - lambda: 'id(active_preset) = 2; id(preset_pending) = 2; id(preset_set_ms) = millis();'
                - script.execute: update_light_ring
                - script.execute: update_light_selection

        - button:
            id: btn_preset_blue
            align: CENTER
            x: 42
            y: 56
            width: 48
            height: 48
            radius: 24
            bg_color: 0x006400
            border_width: 0
            outline_width: 0
            on_click:
              then:
                - lambda: 'id(active_preset) = 3; id(preset_pending) = 3; id(preset_set_ms) = millis();'
                - script.execute: update_light_ring
                - script.execute: update_light_selection

    ###########################################################
    # STATUS
    ###########################################################
    - id: info_page
      bg_color: 0x101116
      bg_opa: COVER
      clickable: true
      on_single_click:
        then:
          - script.execute: dial_next_page
      widgets:
        - label:
            align: CENTER
            y: -82
            text: "STATUS"
            text_font: font_body
            text_color: 0x666A78

        - label:
            id: lbl_info_ceiling
            align: CENTER
            y: -48
            text: "Ceiling --°F"
            text_font: font_body
            text_color: 0xFFFFFF

        - label:
            id: lbl_info_bench
            align: CENTER
            y: -24
            text: "Bench --°F"
            text_font: font_body
            text_color: 0xFFFFFF

        - label:
            id: lbl_info_door
            align: CENTER
            y: 2
            text: "Door --"
            text_font: font_body
            text_color: 0x777B86

        - label:
            id: lbl_info_heater
            align: CENTER
            y: 26
            text: "Heater --"
            text_font: font_body
            text_color: 0x777B86

        - label:
            id: lbl_info_hilimit
            align: CENTER
            y: 50
            text: "Hi-Limit --"
            text_font: font_body
            text_color: 0x777B86

        - label:
            id: lbl_info_feedback
            align: CENTER
            y: 74
            text: "${feedback_placeholder_text}"
            text_font: font_body
            text_color: 0x777B86

        - obj:
            id: btn_clear_fault
            width: 1
            height: 1
            hidden: true
