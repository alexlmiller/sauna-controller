###############################################################################
# Wall Panel - Wired Transport (direct UART)
# For permanent install. Direct packet_transport to the control board.
# Temps arrive in °C from the control board, converted to °F for display.
###############################################################################

############### UART ###############

uart:
  tx_pin: ${panel_tx_pin}
  rx_pin:
    number: ${panel_rx_pin}
    mode: { input: true, pullup: true }
  baud_rate: 115200
  id: controller_uart

packet_transport:
  platform: uart
  uart_id: controller_uart
  update_interval: 150ms
  sensors:
    - cmd_target_temp
    - cmd_heat_on_ctr
    - cmd_heat_off_ctr
    - cmd_light_brightness
    - cmd_light_r
    - cmd_light_g
    - cmd_light_b
    - cmd_light_w
    - cmd_clear_fault_ctr
    - cmd_light_toggle_ctr

############### CONSUMED SENSOR DATA ###############

sensor:
  - platform: packet_transport
    provider: sauna-controller
    id: ceiling_temp_c
    on_value:
      then:
        - lambda: |-
            id(last_rx_ms) = millis();
            id(current_temp) = x * 9.0/5.0 + 32.0;
        - lvgl.label.update:
            id: lbl_current_temp
            text: !lambda 'return std::isfinite(x) ? str_sprintf("%.0f°", x * 9.0/5.0 + 32.0) : std::string("--°");'
        - lvgl.label.update:
            id: lbl_info_ceiling
            text: !lambda 'return str_sprintf("Ceiling  %.0f°F", x * 9.0/5.0 + 32.0);'
        - script.execute: update_status_ring

  - platform: packet_transport
    provider: sauna-controller
    id: bench_temp_c
    on_value:
      then:
        - lambda: 'id(last_rx_ms) = millis();'
        - lvgl.label.update:
            id: lbl_info_bench
            text: !lambda 'return str_sprintf("Bench    %.0f°F", x * 9.0/5.0 + 32.0);'

  - platform: packet_transport
    provider: sauna-controller
    id: target_temp_current
    on_value:
      then:
        - lambda: |-
            id(last_rx_ms) = millis();
            float temp_f = x * 9.0/5.0 + 32.0;
            if (std::isfinite(temp_f)) id(synced) = true;
            if (millis() - id(last_target_interaction_ms) > 2000) {
              id(local_target_temp) = temp_f;
            }

  - platform: packet_transport
    provider: sauna-controller
    id: fault_code
    remote_id: fault_code_sensor
    on_value:
      then:
        - lambda: 'id(last_rx_ms) = millis();'
        - if:
            condition:
              lambda: 'return (int)x > 0;'
            then:
              - lvgl.widget.show: fault_banner
              - lvgl.widget.show: btn_clear_fault
              - lvgl.label.update:
                  id: lbl_fault_text
                  text: !lambda |-
                    int code = (int)x;
                    switch(code) {
                      case 1: return std::string("DOOR OPEN");
                      case 2: return std::string("OVER TEMP");
                      case 3: return std::string("RELAY FAULT");
                      case 4: return std::string("SENSOR FAULT");
                      case 5: return std::string("HIGH LIMIT");
                      default: return std::string("FAULT");
                    }
            else:
              - lvgl.widget.hide: fault_banner
              - lvgl.widget.hide: btn_clear_fault
        - script.execute: update_status_ring

  - platform: packet_transport
    provider: sauna-controller
    id: light_brightness_current
    on_value:
      then:
        - lambda: |-
            id(last_rx_ms) = millis();
            if (millis() - id(last_brightness_interaction_ms) > 2000) {
              id(local_brightness) = x;
              lv_arc_set_value(id(arc_brightness), (int)(x * 100.0f));
            }

  - platform: packet_transport
    provider: sauna-controller
    id: light_r_current
    on_value:
      then:
        - lambda: |-
            id(last_rx_ms) = millis();
            if (millis() - id(last_color_interaction_ms) > 2000) { id(local_light_r) = x; }

  - platform: packet_transport
    provider: sauna-controller
    id: light_g_current
    on_value:
      then:
        - lambda: |-
            id(last_rx_ms) = millis();
            if (millis() - id(last_color_interaction_ms) > 2000) { id(local_light_g) = x; }

  - platform: packet_transport
    provider: sauna-controller
    id: light_b_current
    on_value:
      then:
        - lambda: |-
            id(last_rx_ms) = millis();
            if (millis() - id(last_color_interaction_ms) > 2000) { id(local_light_b) = x; }

  - platform: packet_transport
    provider: sauna-controller
    id: light_w_current
    on_value:
      then:
        - lambda: |-
            id(last_rx_ms) = millis();
            if (millis() - id(last_color_interaction_ms) > 2000) {
              id(local_light_w) = x;
              const float r = id(local_light_r), g = id(local_light_g);
              const float b = id(local_light_b), w = id(local_light_w);
              auto near = [](float a, float b) { return fabsf(a - b) < 0.05f; };
              int preset = -1;
              if (near(r, 0) && near(g, 0) && near(b, 0) && near(w, 1)) preset = 0;
              else if (near(r, .5f) && near(g, .3f) && near(b, .1f) && near(w, .8f)) preset = 1;
              else if (near(r, 1) && near(g, .31f) && near(b, .16f) && near(w, .24f)) preset = 2;
              else if (near(r, 0) && near(g, .39f) && near(b, 0) && near(w, 0)) preset = 3;
              id(active_preset) = preset;
              id(light_ring_color) = preset == 0 ? 0xFFFFFF : preset == 1 ? 0xFFB366 :
                                     preset == 2 ? 0x8B0000 : preset == 3 ? 0x006400 : 0xFF6B00;
            }
        - script.execute: update_light_ring
        - script.execute: update_light_selection

  ############### COMMAND SENSORS ###############

  # Target updates are draft-state based. Heat mode changes are explicit counters.
  - platform: template
    id: cmd_target_temp
    lambda: |-
      if (!id(link_up) || !id(synced) || std::isnan(id(local_target_temp)) ||
          millis() - id(last_target_interaction_ms) > 2000) return NAN;
      return (id(local_target_temp) - 32.0f) * 5.0f / 9.0f;
    update_interval: 150ms

  - platform: template
    id: cmd_heat_on_ctr
    lambda: 'return (float)id(heat_on_ctr);'
    update_interval: 150ms

  - platform: template
    id: cmd_heat_off_ctr
    lambda: 'return (float)id(heat_off_ctr);'
    update_interval: 150ms

  - platform: template
    id: cmd_light_brightness
    lambda: |-
      if (!id(link_up) || !id(synced) || millis() - id(last_brightness_interaction_ms) > 2000) return NAN;
      return id(local_brightness);
    update_interval: 150ms

  - platform: template
    id: cmd_light_r
    lambda: |-
      if (!id(link_up) || !id(synced) || millis() - id(last_color_interaction_ms) > 2000) return NAN;
      return id(local_light_r);
    update_interval: 150ms

  - platform: template
    id: cmd_light_g
    lambda: |-
      if (!id(link_up) || !id(synced) || millis() - id(last_color_interaction_ms) > 2000) return NAN;
      return id(local_light_g);
    update_interval: 150ms

  - platform: template
    id: cmd_light_b
    lambda: |-
      if (!id(link_up) || !id(synced) || millis() - id(last_color_interaction_ms) > 2000) return NAN;
      return id(local_light_b);
    update_interval: 150ms

  - platform: template
    id: cmd_light_w
    lambda: |-
      if (!id(link_up) || !id(synced) || millis() - id(last_color_interaction_ms) > 2000) return NAN;
      return id(local_light_w);
    update_interval: 150ms

  - platform: template
    id: cmd_clear_fault_ctr
    lambda: 'return (float)id(clear_fault_ctr);'
    update_interval: 150ms

  - platform: template
    id: cmd_light_toggle_ctr
    lambda: 'return (float)id(light_toggle_ctr);'
    update_interval: 150ms

############### CONSUMED STATUS DATA ###############

binary_sensor:
  - platform: packet_transport
    provider: sauna-controller
    id: door_sensor
    on_state:
      then:
        - lambda: 'id(last_rx_ms) = millis();'
        - lvgl.label.update:
            id: lbl_info_door
            text: !lambda 'return x ? std::string("Door     OPEN") : std::string("Door     CLOSED");'
            text_color: !lambda 'return x ? lv_color_hex(0xFF6B00) : lv_color_hex(0x00CC66);'

  - platform: packet_transport
    provider: sauna-controller
    id: ${feedback_sensor_id}
    on_state:
      then:
        - lambda: |-
            id(last_rx_ms) = millis();
            id(heater_running) = x;
        - script.execute: update_status_ring
        - lvgl.label.update:
            id: lbl_info_feedback
            text: !lambda 'return x ? std::string("${feedback_on_text}") : std::string("${feedback_off_text}");'
            text_color: !lambda 'return x ? lv_color_hex(0x00CC66) : lv_color_hex(0x888888);'

  - platform: packet_transport
    provider: sauna-controller
    id: high_limit_trip
    on_state:
      then:
        - lambda: 'id(last_rx_ms) = millis();'
        - lvgl.label.update:
            id: lbl_info_hilimit
            text: !lambda 'return x ? std::string("Hi-Limit TRIP") : std::string("Hi-Limit OK");'
            text_color: !lambda 'return x ? lv_color_hex(0xFF0000) : lv_color_hex(0x00CC66);'

  - platform: packet_transport
    provider: sauna-controller
    id: fault_latched_bs
    on_state:
      then:
        - lambda: |-
            id(last_rx_ms) = millis();
            id(fault_active) = x;
        - if:
            condition:
              lambda: 'return x;'
            then:
              - lvgl.widget.show: fault_banner
              - lvgl.widget.show: btn_clear_fault
            else:
              - lvgl.widget.hide: fault_banner
              - lvgl.widget.hide: btn_clear_fault
        - script.execute: update_status_ring

  - platform: packet_transport
    provider: sauna-controller
    id: heat_mode_active
    on_state:
      then:
        - lambda: |-
            id(last_rx_ms) = millis();
            float controller_val = x ? 1.0f : 0.0f;
            id(local_heat_mode) = controller_val;
            if (!x) {
              id(heat_on_pending) = false;
            }
        - script.execute: update_status_ring
        - lvgl.label.update:
            id: lbl_info_heater
            text: !lambda 'return x ? std::string("Heater   HEAT") : std::string("Heater   OFF");'
            text_color: !lambda 'return x ? lv_color_hex(0xFF6B00) : lv_color_hex(0x888888);'

  - platform: packet_transport
    provider: sauna-controller
    id: light_on
    on_state:
      then:
        - lambda: 'id(last_rx_ms) = millis(); id(local_light_on) = x;'
        - script.execute: update_light_ring

############### WIRED COMMAND FLAGS ###############
# Preset/one-shot command processing
interval:
  - interval: 100ms
    then:
      - lambda: |-
          if (!id(link_up) || !id(synced)) {
            id(preset_pending) = -1;
            id(light_toggle_pending) = false;
            id(clear_fault_pending) = false;
            return;
          }
          if (id(preset_pending) >= 0) {
            int p = id(preset_pending);
            id(preset_pending) = -1;
            id(last_color_interaction_ms) = millis();
            switch(p) {
              case 0: // WHITE
                id(local_light_r) = 0.0f; id(local_light_g) = 0.0f;
                id(local_light_b) = 0.0f; id(local_light_w) = 1.0f;
                break;
              case 1: // WARM
                id(local_light_r) = 0.5f; id(local_light_g) = 0.3f;
                id(local_light_b) = 0.1f; id(local_light_w) = 0.8f;
                break;
              case 2: // RED
                id(local_light_r) = 1.0f; id(local_light_g) = 0.31f;
                id(local_light_b) = 0.16f; id(local_light_w) = 0.24f;
                break;
              case 3: // GREEN
                id(local_light_r) = 0.0f; id(local_light_g) = 0.39f;
                id(local_light_b) = 0.0f; id(local_light_w) = 0.0f;
                break;
            }
          }
          if (id(light_toggle_pending)) {
            id(light_toggle_pending) = false;
            id(light_toggle_ctr) += 1;
          }
          if (id(clear_fault_pending)) {
            id(clear_fault_pending) = false;
            id(clear_fault_ctr) += 1;
          }
