###############################################################################
# Wall Panel - CrowPanel LVGL UI
###############################################################################

############### FONTS ###############

font:
  - file: "gfonts://Montserrat@300"
    id: font_hero
    size: 96
    bpp: 4
    glyphs: " 0123456789°"
  - file: "gfonts://Montserrat@400"
    id: font_body
    size: 22
    bpp: 4
    glyphs: " !%()-./0123456789:ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz°"
  - file: "gfonts://Montserrat@400"
    id: font_body_lg
    size: 28
    bpp: 4
    glyphs: " !%()-./0123456789:ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz°"

############### LVGL UI ###############

lvgl:
  displays:
    - panel_display
  touchscreens:
    - panel_touch
  encoders:
    - group: main_group
      enter_button: encoder_button
      sensor: panel_encoder
  color_depth: 16
  buffer_size: 100%
  page_wrap: true








  pages:
    ###########################################################
    # TEMPERATURE
    ###########################################################
    - id: main_page
      bg_color: 0x111118
      bg_opa: COVER
      widgets:
        # Ring
        - arc:
            id: arc_status_ring
            width: 460
            height: 460
            align: CENTER
            x: 2
            y: 9
            adjustable: false
            start_angle: 135
            end_angle: 45
            value: 100
            min_value: 0
            max_value: 100
            arc_width: 36
            arc_color: 0x222230
            indicator:
              arc_width: 36
              arc_color: 0x555555

        # Page title
        - label:
            align: CENTER
            y: -115
            text: "HEATER"
            text_font: font_body
            text_color: 0x555555

        # Temperature
        - label:
            id: lbl_current_temp
            align: CENTER
            y: -15
            text: "--°"
            text_font: font_hero
            text_color: 0xFFFFFF

        # Target
        - label:
            id: lbl_target_temp
            align: CENTER
            y: 55
            text: "--°F"
            text_font: font_body_lg
            text_color: 0x666666

        # Status
        - label:
            id: lbl_status
            align: CENTER
            y: 105
            text: "OFF"
            text_font: font_body_lg
            text_color: 0x555555

        # Fault
        - obj:
            id: fault_banner
            align: CENTER
            y: -85
            width: 240
            height: 48
            bg_color: 0xDD2222
            bg_opa: COVER
            radius: 24
            hidden: true
            widgets:
              - label:
                  id: lbl_fault_text
                  align: CENTER
                  text: "FAULT"
                  text_font: font_body
                  text_color: 0xFFFFFF

        # No link
        - label:
            id: no_link_warning
            align: CENTER
            y: -75
            text: "NO LINK"
            text_font: font_body
            text_color: 0xFF5555
            hidden: true

        # Page nav — tap zone in ring gap at bottom
        - obj:
            align: BOTTOM_MID
            y: -15
            width: 160
            height: 60
            bg_opa: TRANSP
            border_width: 0
            on_click:
              then:
                - lambda: 'id(lv_active_page) = (id(lv_active_page) + 1) % 3;'
                - lvgl.page.next:
                    animation: NONE
                    time: 0ms
            widgets:
              - obj:
                  align: CENTER
                  x: -10
                  y: 0
                  width: 7
                  height: 7
                  radius: 4
                  bg_color: 0x999999
                  bg_opa: COVER
                  border_width: 0
              - obj:
                  align: CENTER
                  x: 2
                  y: 0
                  width: 5
                  height: 5
                  radius: 3
                  bg_color: 0x444444
                  bg_opa: COVER
                  border_width: 0
              - obj:
                  align: CENTER
                  x: 12
                  y: 0
                  width: 5
                  height: 5
                  radius: 3
                  bg_color: 0x444444
                  bg_opa: COVER
                  border_width: 0

    ###########################################################
    # LIGHTING — 2x2 color circles
    ###########################################################
    - id: light_page
      bg_color: 0x111118
      bg_opa: COVER
      widgets:
        # Brightness ring
        - arc:
            id: arc_brightness
            width: 460
            height: 460
            align: CENTER
            x: 2
            y: 9
            adjustable: false
            start_angle: 135
            end_angle: 45
            min_value: 0
            max_value: 100
            value: 0
            arc_width: 36
            arc_color: 0x222230
            indicator:
              arc_width: 36
              arc_color: 0xFF6B00

        # Page title
        - label:
            align: CENTER
            y: -115
            text: "LIGHTS"
            text_font: font_body
            text_color: 0x555555

        # Hidden brightness label for data binding
        - label:
            id: lbl_brightness_pct
            hidden: true
            text: ""

        # 2x2 color circles — no labels, bigger
        - button:
            id: btn_preset_warm
            align: CENTER
            x: -52
            y: -22
            width: 80
            height: 80
            radius: 40
            bg_color: 0xFFFFFF
            border_width: 0
            outline_width: 0
            on_click:
              then:
                - lambda: 'id(active_preset) = 0; id(preset_pending) = 0; id(preset_set_ms) = millis();'
                - script.execute: update_light_ring
                - script.execute: update_light_selection

        - button:
            id: btn_preset_sunset
            align: CENTER
            x: 52
            y: -22
            width: 80
            height: 80
            radius: 40
            bg_color: 0xFFB366
            border_width: 0
            outline_width: 0
            on_click:
              then:
                - lambda: 'id(active_preset) = 1; id(preset_pending) = 1; id(preset_set_ms) = millis();'
                - script.execute: update_light_ring
                - script.execute: update_light_selection

        - button:
            id: btn_preset_red
            align: CENTER
            x: -52
            y: 82
            width: 80
            height: 80
            radius: 40
            bg_color: 0x8B0000
            border_width: 0
            outline_width: 0
            on_click:
              then:
                - lambda: 'id(active_preset) = 2; id(preset_pending) = 2; id(preset_set_ms) = millis();'
                - script.execute: update_light_ring
                - script.execute: update_light_selection

        - button:
            id: btn_preset_blue
            align: CENTER
            x: 52
            y: 82
            width: 80
            height: 80
            radius: 40
            bg_color: 0x006400
            border_width: 0
            outline_width: 0
            on_click:
              then:
                - lambda: 'id(active_preset) = 3; id(preset_pending) = 3; id(preset_set_ms) = millis();'
                - script.execute: update_light_ring
                - script.execute: update_light_selection

        # Page dots
        # Page nav — tap zone in ring gap at bottom
        - obj:
            align: BOTTOM_MID
            y: -15
            width: 160
            height: 60
            bg_opa: TRANSP
            border_width: 0
            on_click:
              then:
                - lambda: 'id(lv_active_page) = (id(lv_active_page) + 1) % 3;'
                - lvgl.page.next:
                    animation: NONE
                    time: 0ms
            widgets:
              - obj:
                  align: CENTER
                  x: -10
                  y: 0
                  width: 5
                  height: 5
                  radius: 3
                  bg_color: 0x444444
                  bg_opa: COVER
                  border_width: 0
              - obj:
                  align: CENTER
                  x: 2
                  y: 0
                  width: 7
                  height: 7
                  radius: 4
                  bg_color: 0x999999
                  bg_opa: COVER
                  border_width: 0
              - obj:
                  align: CENTER
                  x: 12
                  y: 0
                  width: 5
                  height: 5
                  radius: 3
                  bg_color: 0x444444
                  bg_opa: COVER
                  border_width: 0

    ###########################################################
    # STATUS
    ###########################################################
    - id: info_page
      bg_color: 0x111118
      bg_opa: COVER
      widgets:
        - label:
            align: CENTER
            y: -115
            text: "STATUS"
            text_font: font_body
            text_color: 0x555555

        - label:
            id: lbl_info_ceiling
            align: CENTER
            y: -55
            text: "Ceiling  --°F"
            text_font: font_body_lg
            text_color: 0xFFFFFF

        - label:
            id: lbl_info_bench
            align: CENTER
            y: -20
            text: "Bench    --°F"
            text_font: font_body_lg
            text_color: 0xFFFFFF

        - obj:
            align: CENTER
            y: 8
            width: 160
            height: 1
            bg_color: 0x333340
            bg_opa: COVER
            border_width: 0

        - label:
            id: lbl_info_door
            align: CENTER
            y: 30
            text: "Door     --"
            text_font: font_body
            text_color: 0x666666

        - label:
            id: lbl_info_heater
            align: CENTER
            y: 57
            text: "Heater   --"
            text_font: font_body
            text_color: 0x666666

        - label:
            id: lbl_info_hilimit
            align: CENTER
            y: 84
            text: "Hi-Limit --"
            text_font: font_body
            text_color: 0x666666

        - label:
            id: lbl_info_feedback
            align: CENTER
            y: 111
            text: "${feedback_placeholder_text}"
            text_font: font_body
            text_color: 0x666666

        - button:
            id: btn_clear_fault
            align: CENTER
            y: 115
            width: 180
            height: 44
            bg_color: 0xCC3333
            radius: 22
            shadow_width: 16
            shadow_color: 0xFF0000
            shadow_opa: 20%
            hidden: true
            group: main_group
            on_click:
              then:
                - lambda: 'id(clear_fault_pending) = true;'
            widgets:
              - label:
                  align: CENTER
                  text: "CLEAR FAULT"
                  text_font: font_body
                  text_color: 0xFFFFFF

        # Page dots
        # Page nav — tap zone at bottom
        - obj:
            align: BOTTOM_MID
            y: -15
            width: 160
            height: 60
            bg_opa: TRANSP
            border_width: 0
            on_click:
              then:
                - lambda: 'id(lv_active_page) = (id(lv_active_page) + 1) % 3;'
                - lvgl.page.next:
                    animation: NONE
                    time: 0ms
            widgets:
              - obj:
                  align: CENTER
                  x: -10
                  y: 0
                  width: 5
                  height: 5
                  radius: 3
                  bg_color: 0x444444
                  bg_opa: COVER
                  border_width: 0
              - obj:
                  align: CENTER
                  x: 2
                  y: 0
                  width: 5
                  height: 5
                  radius: 3
                  bg_color: 0x444444
                  bg_opa: COVER
                  border_width: 0
              - obj:
                  align: CENTER
                  x: 12
                  y: 0
                  width: 7
                  height: 7
                  radius: 4
                  bg_color: 0x999999
                  bg_opa: COVER
                  border_width: 0
